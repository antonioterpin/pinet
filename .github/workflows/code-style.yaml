name: Coding style validation

on:
  push:
    branches:
      - '**'

jobs:
  code-style-check:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code
      - name: Check out code
        uses: actions/checkout@v6

      # Step 2: Set up Python
      #
      # The style check is pinned to 3.13 (the version contributors run
      # locally) so basedpyright resolves cvxpy/cvxpylayers stubs the same
      # way on CI. The test workflow still runs 3.10 to verify the library's
      # declared minimum Python.
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      # Step 3: Install uv so pre-commit hooks that shell out to
      # ``uv run <tool>`` (pydoclint, basedpyright) can find the executable.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Step 4: Install project dev deps via uv so ``uv run pydoclint`` and
      # ``uv run basedpyright`` resolve to the pinned versions.
      - name: Install dev dependencies
        run: uv sync --extra dev

      # Step 5: Run pre-commit hooks via ``uv run`` so we get the version
      # pinned in the lock file (4.0.1). A system ``pip install pre-commit``
      # pulls the latest (4.6.0), which parses hook ``entry`` strings
      # differently and silently drops flags like ``--level error``.
      #
      # ``env -u GITHUB_ACTIONS`` unsets the runner-injected variable for
      # the duration of the command. basedpyright otherwise detects CI and
      # switches into workflow-annotation mode, which emits every warning
      # as an inline annotation and ignores ``--level error`` when
      # computing the exit code. Contributors run ``--level error`` locally
      # (warnings = OK, errors = fail); CI should do the same. A
      # step-level ``env:`` block does NOT override ``GITHUB_ACTIONS``
      # because the runner re-injects the reserved ``GITHUB_*`` vars after
      # the block is applied.
      - name: Run pre-commit (commit stage)
        run: env -u GITHUB_ACTIONS uv run pre-commit run --all-files

      - name: Run pre-commit (push stage)
        run: env -u GITHUB_ACTIONS uv run pre-commit run --hook-stage push --all-files
